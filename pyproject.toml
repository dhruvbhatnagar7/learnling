[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learnling"
version = "0.2.0"
description = "An open, screen-free reading companion that listens while a child reads aloud."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Dhruv Bhatnagar", email = "dhruvbhatnagar7@gmail.com" },
]
keywords = ["education", "literacy", "speech-recognition", "ai-agents", "child-safety", "voice"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Education",
]
dependencies = []

[project.optional-dependencies]
# faster-whisper 1.2.1 passes an argument PyAV 19 removed; drop the cap once it is fixed upstream.
asr = ["faster-whisper>=1.0.0", "av<19"]
vosk = ["vosk>=0.3.45"]
mic = ["sounddevice>=0.4.6"]
live = ["sherpa-onnx>=1.10.0", "numpy", "sounddevice>=0.4.6"]
llm = ["anthropic>=0.40.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
learnling = "learnling.cli:main"

[project.urls]
Homepage = "https://github.com/dhruvbhatnagar7/learnling"

[tool.setuptools.packages.find]
include = ["learnling*"]

[tool.setuptools.package-data]
learnling = ["data/*.json"]
